#
# SSW CI
#
name: Java CI with Gradle

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  ci:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Show Java and Gradle versions
      run: |
        java -version
        ./gradlew --version
      
    #
    # Perform a Release Build
    #
    - name: Build with Gradle
      run: ./gradlew releaseBuild

    #
    # Resolve version name for release archive
    #
    - name: Generate name for archive
      run: echo "SSW_VERSION=$(ls ./build/release)-$(git rev-parse --short=10 HEAD)" >> $GITHUB_ENV

    #
    # Upload release distribution zipfile
    #
    - name: Upload Releases
      uses: actions/upload-artifact@v4

      with:
        path: ./build/release/
        name: ${{ env.SSW_VERSION }}
