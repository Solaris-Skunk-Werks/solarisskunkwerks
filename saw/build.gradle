plugins {
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
    implementation project(':sswlib')
    implementation 'org.netbeans.external:AbsoluteLayout:RELEASE110'
}

sourceSets {
    main {
        resources.srcDir "${buildDir}/generated/resources"
    }

    test {
        resources.srcDir project(':sswlib').file('src/test/resources')
    }
}

application {
    mainClass = 'saw.Main'
}

jar {
    manifest.attributes (
            'Main-Class' : 'saw.Main',
            'Class-Path' : configurations.runtimeClasspath.files
                    .findAll { it.name.endsWith(".jar") }.collect { "lib/${it.name}" }.join(' '),
            'SplashScreen-Image' : 'saw/images/splash.png'
    )
    archiveFileName = "SAW.jar"
}

task deleteAssets {
    // Make sure we have a fresh copy of the Data folder before new builds/runs
    delete {
        project.delete('Data')
    }
}

task copyAssets (dependsOn: deleteAssets) {
    copy {
        from '../'
        into '.'
        include 'Data/**'
    }
}

task writeProperties(type: WriteProperties) {
    outputFile "${buildDir}/generated/resources/saw/build.properties"
    property 'version', version
    property 'release', release
    property 'rev', rev
}

processResources.dependsOn(writeProperties)
jar.dependsOn(writeProperties)

task copyDependencies {
    copy {
        into "${buildDir}/deps"
        from configurations.runtimeClasspath
    }
}
