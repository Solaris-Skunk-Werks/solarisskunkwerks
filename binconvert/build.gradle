plugins {
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
    implementation project(':sswlib')
    implementation 'org.netbeans.external:AbsoluteLayout:RELEASE110'
}

application {
    mainClass = "binaryconverter.Main"
}

jar {
    manifest.attributes (
            'Main-Class' : 'binaryconverter.Main',
            'Class-Path' : configurations.runtimeClasspath.files
                    .findAll { it.name.endsWith(".jar") }.collect { "lib/${it.name}" }.join(' '),
    )
    archiveFileName = "binconvert.jar"
}

task copyDependencies {
    copy {
        into "${buildDir}/deps"
        from configurations.runtimeClasspath
    }
}
